name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/agentconv-darwin-arm64 ./cmd/agentconv
          GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agentconv-darwin-amd64 ./cmd/agentconv
      - uses: actions/upload-artifact@v4
        with:
          name: agentconv-darwin-arm64
          path: dist/agentconv-darwin-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agentconv-darwin-amd64
          path: dist/agentconv-darwin-amd64
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        shell: pwsh
        run: go test ./...
      - name: Build
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w" -o dist/agentconv-windows-amd64.exe ./cmd/agentconv
      - uses: actions/upload-artifact@v4
        with:
          name: agentconv-windows-amd64
          path: dist/agentconv-windows-amd64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/agentconv-linux-amd64 ./cmd/agentconv
          GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/agentconv-linux-arm64 ./cmd/agentconv
      - uses: actions/upload-artifact@v4
        with:
          name: agentconv-linux-amd64
          path: dist/agentconv-linux-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agentconv-linux-arm64
          path: dist/agentconv-linux-arm64
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "agentconv $TAG" --generate-notes
          fi
